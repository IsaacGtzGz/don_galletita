{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Mi Perfil</h2>
    <div class="card">
        <div class="card-header">
            Número de Cliente: {{ cliente_id }}
        </div>
        <div class="card-body">
            <p><strong>Nombre:</strong> {{ cliente.nombre }}</p>
            <p><strong>Apellidos:</strong> {{ cliente.apellido_paterno }} {{ cliente.apellido_materno }}</p>
        </div>
    </div>
</div>
{% endblock %}
