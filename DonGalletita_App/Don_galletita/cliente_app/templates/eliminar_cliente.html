{% extends 'base.html' %}
{% block title %}
  Eliminar Cliente
{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-header bg-danger text-white">
      <h3 class="card-title">Confirmar Eliminación</h3>
    </div>
    <div class="card-body">
      <p>
        ¿Estás seguro de que deseas eliminar al cliente <strong>{{ cliente.nombre }} {{ cliente.apellido_paterno }} {{ cliente.apellido_materno }}</strong>?
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
