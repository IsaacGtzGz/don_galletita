{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Registrar Nueva Compra</h1>
    <form method="post" id="compraForm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="proveedor" class="form-label">Proveedor</label>
            <select name="proveedor" id="proveedor" class="form-select" required>
                <option value="" disabled selected>Seleccione un proveedor</option>
                {% for proveedor in proveedores %}
                <option value="{{ proveedor.id }}">{{ proveedor.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="insumo" class="form-label">Insumo</label>
            <select id="insumo" class="form-select">
                <option value="" disabled selected>Seleccione un insumo</option>
                {% for insumo in insumos %}
                <option value="{{ insumo.id }}" data-unidad="{{ insumo.unidad }}">{{ insumo.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row">
            <div class="col-md-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" id="cantidad" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-3">
                <label for="unidad" class="form-label">Unidad</label>
                <input type="text" id="unidad" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label for="precio" class="form-label">Precio Unitario</label>
                <input type="number" id="precio" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-3">
                <label for="fecha_caducidad" class="form-label">Fecha de Caducidad</label>
                <input type="date" id="fecha_caducidad" class="form-control" required>
            </div>
        </div>

        <div class="mt-3">
            <button type="button" id="agregarItem" class="btn btn-primary">Agregar Item</button>
        </div>

        <h3 class="mt-4">Items Agregados</h3>
        <table class="table table-bordered" id="itemsTable">
            <thead>
                <tr>
                    <th>Insumo</th>
                    <th>Cantidad</th>
                    <th>Unidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                    <th>Fecha de Caducidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los items agregados se mostrarán aquí -->
            </tbody>
        </table>

        <div class="mt-3">
            <h4>Total: $<span id="total">0.00</span></h4>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Confirmar Compra</button>
            <a href="{% url 'listar_compras' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const insumoSelect = document.getElementById('insumo');
        const unidadInput = document.getElementById('unidad');
        const agregarItemButton = document.getElementById('agregarItem');
        const itemsTable = document.getElementById('itemsTable').querySelector('tbody');
        const totalSpan = document.getElementById('total');
        let total = 0;

        // Actualizar unidad automáticamente al seleccionar un insumo
        insumoSelect.addEventListener('change', function () {
            const selectedOption = insumoSelect.options[insumoSelect.selectedIndex];
            unidadInput.value = selectedOption.getAttribute('data-unidad');
        });

        // Agregar item a la tabla
        agregarItemButton.addEventListener('click', function () {
            const insumoText = insumoSelect.options[insumoSelect.selectedIndex].text;
            const insumoId = insumoSelect.value;
            const cantidad = parseFloat(document.getElementById('cantidad').value);
            const unidad = unidadInput.value;
            const precio = parseFloat(document.getElementById('precio').value);
            const fechaCaducidad = document.getElementById('fecha_caducidad').value;

            if (!insumoId || !cantidad || !precio || !fechaCaducidad) {
                alert('Por favor, complete todos los campos antes de agregar un item.');
                return;
            }

            const subtotal = cantidad * precio;
            total += subtotal;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${insumoText}</td>
                <td>${cantidad}</td>
                <td>${unidad}</td>
                <td>$${precio.toFixed(2)}</td>
                <td>$${subtotal.toFixed(2)}</td>
                <td>${fechaCaducidad}</td>
                <td><button type="button" class="btn btn-danger btn-sm eliminarItem">Eliminar</button></td>
            `;

            itemsTable.appendChild(row);
            totalSpan.textContent = total.toFixed(2);

            // Limpiar campos
            document.getElementById('cantidad').value = '';
            document.getElementById('precio').value = '';
            document.getElementById('fecha_caducidad').value = '';
            insumoSelect.selectedIndex = 0;
            unidadInput.value = '';
        });

        // Eliminar item de la tabla
        itemsTable.addEventListener('click', function (e) {
            if (e.target.classList.contains('eliminarItem')) {
                const row = e.target.closest('tr');
                const subtotal = parseFloat(row.children[4].textContent.replace('$', ''));
                total -= subtotal;
                totalSpan.textContent = total.toFixed(2);
                row.remove();
            }
        });
    });
</script>
{% endblock %}
