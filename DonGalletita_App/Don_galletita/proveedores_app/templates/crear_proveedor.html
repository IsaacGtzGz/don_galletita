{% extends "base.html" %}
{% load static %}
{% block content %}


  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="text-center mb-4">Registrar Proveedor</h1>
        <form method="POST" class="border p-4 rounded shadow-sm bg-light">
          {% csrf_token %}
          <div class="mb-3">
            {{ form.as_p }}
          </div>

          <!-- Mostrar errores -->
          {% if form.errors %}
            <div class="alert alert-danger">
              <ul>
                {% for field, errors in form.errors.items %}
                  {% for error in errors %}
                    <li>{{ error }}</li>
                  {% endfor %}
                {% endfor %}
              </ul>
            </div>
          {% endif %}

          <!-- Botón de envío -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

{% endblock content %}
