{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Editar Cliente{% else %}Crear Cliente{% endif %}{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Editar Cliente{% else %}Crear Cliente{% endif %}</h1>
    <form method="post" class="cliente-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'cliente_list' %}" class="button">Cancelar</a>
    </form>
{% endblock %}
