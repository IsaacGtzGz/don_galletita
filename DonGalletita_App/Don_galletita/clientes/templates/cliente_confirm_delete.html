{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
    <h1>¿Estás seguro de que deseas eliminar a {{ cliente.nombre_cliente }}?</h1>
    <form method="post" class="delete-form">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'cliente_list' %}" class="button">Cancelar</a>
    </form>
{% endblock %}
