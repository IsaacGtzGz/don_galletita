{% extends "base.html" %}
{% load static %}
{% block content %}
    <h1 class="text-center">Editar Insumo</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        {% for error in field.errors %}
            <li>{{error}}</li>
        {% endfor %}
        <button>Actualizar</button>
    </form>
{% endblock content %}
