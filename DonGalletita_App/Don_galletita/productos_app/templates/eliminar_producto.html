{% extends 'base.html' %}
{% load static %}
{% block content %}
  <div class="container">
    <h1>{{ titulo }}</h1>
    <p>¿Estás seguro de que deseas eliminar el producto {{ object.nombre }}?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Eliminar</button>
      <a href="{% url 'productos:lista_productos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
