{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row full-height justify-content-center">
      <div class="col-12 text-center align-self-center py-5">
        <div class="section pb-5 pt-5 pt-sm-2 text-center">
          <h6 class="mb-0 pb-3"><span>Iniciar Sesión</span><span>Registrarse</span></h6>
          <input class="checkbox" type="checkbox" id="reg-log" name="reg-log" />
          <label for="reg-log"></label>
          <div class="card-3d-wrap mx-auto">
            <div class="card-3d-wrapper">
              <div class="card-front">
                <div class="center-wrap">
                  <div class="section text-center">
                    <h4 class="mb-4 pb-3">Iniciar Sesión</h4>
                    <form method="post" action="{% url 'login' %}">
                      {% csrf_token %}
                      <div class="form-group">
                        <input type="text" name="username" class="form-style" placeholder="Tu Nombre de Usuario" id="logusername" autocomplete="off" />
                        <img src="{% static 'assets/galleta.png' %}" alt="Icono de Galleta" style="width: 24px; height: 24px; position: absolute; right: 10px; top: 10px;" />
                      </div>
                      <div class="form-group mt-2">
                        <input type="password" name="password" class="form-style" placeholder="Tu Contraseña" id="logpassword" autocomplete="off" />
                        <img src="{% static 'assets/galleta.png' %}" alt="Icono de Galleta" style="width: 24px; height: 24px; position: absolute; right: 10px; top: 10px;" />
                      </div>
                      <input type="submit" value="Iniciar Sesión" class="btn mt-4" />
                      <input type="hidden" name="next" value="{{ next }}" />
                    </form>
                    <p class="mb-0 mt-4 text-center">
                      <a href="{% url 'password_reset' %}" class="link">¿Olvidaste tu contraseña?</a>
                    </p>
                  </div>
                </div>
              </div>
              <div class="card-back">
                <div class="center-wrap">
                  <div class="section text-center">
                    <h4 class="mb-4 pb-3">Registrarse</h4>
                    <form method="post" action="{% url 'registro_cliente' %}">
                      {% csrf_token %}
                      <div class="form-group">
                        <input type="text" name="nombre_usuario" class="form-style" placeholder="Nombre de Usuario" id="logname" autocomplete="off" required />
                        <img src="{% static 'assets/galleta.png' %}" alt="Icono de Galleta" style="width: 24px; height: 24px; position: absolute; right: 10px; top: 10px;" />
                      </div>
                      <div class="form-group mt-2">
                        <input type="password" name="contrasenia" class="form-style" placeholder="Contraseña" id="logpass" autocomplete="off" required />
                        <img src="{% static 'assets/galleta.png' %}" alt="Icono de Galleta" style="width: 24px; height: 24px; position: absolute; right: 10px; top: 10px;" />
                      </div>
                      <!-- Campo de rol eliminado ya que ahora es asignado por defecto en el backend -->
                      <input type="submit" value="Registrarse" class="btn mt-4" />
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const showRegisterForm = "{{ show_register_form|default_if_none:False|yesno:'true,false' }}" === 'true'
      if (showRegisterForm) {
        document.getElementById('reg-log').checked = true
      }
    })
  </script>
{% endblock %}
